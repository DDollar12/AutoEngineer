services:
  - type: web
    name: autoengineer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autoengineer-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false

databases:
  - name: autoengineer-db
    databaseName: autoengineer
    user: autoengineer
