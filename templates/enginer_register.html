<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Engineer Registration - AutoEngineer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <nav>
        <a class="logo" href="{{ url_for('home') }}">
            <img src="{{ url_for('static', filename='img/autoengineer-logo.svg') }}" alt="AutoEngineer home">
        </a>
        <div>
            <a href="{{ url_for('home') }}">Home</a>
        </div>
    </nav>

    <section class="services">
            <h2>Become an AutoEngineer</h2>

            <p>Create your professional engineer account and claim the #200 new applicant bonus.</p>

            <p class="referral-note">Have a referral link? Use it when you join so the referrer can receive their #200 bonus.</p>

            <br>

            <form method="POST" action="/engineer-register">
                <input type="text" name="name" placeholder="Full Name" required>

                <br><br>

                <input type="email" name="email" placeholder="Email Address" required>

                <br><br>
                
                <input type="tel" name="phone" placeholder="Phone Number" required>

                <br><br>

                <input type="password" name="password" placeholder="Password" required>

                <br><br>

                <input type="text" name="specialization" placeholder="Specialization (e.g Engine, Electrical)" required>

                <br><br>

                <input type="text" name="location" value="Nigeria" aria-label="Location" readonly required>

                <br><br>

                <input type="text" name="experience" placeholder="Years of Experience" required>
                
                <br><br>

                <button type="submit" class="button">Create Engineer Account</button>
            </form>
        </section>

</body>
</html>
