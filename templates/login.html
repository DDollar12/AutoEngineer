<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AutoEngineer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <a class="logo" href="{{ url_for('home') }}">
            <img src="{{ url_for('static', filename='img/autoengineer-logo.svg') }}" alt="AutoEngineer home">
        </a>
        <div>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('customer_register') }}">Customer</a>
            <a href="{{ url_for('engineer_register') }}">Engineer</a>
        </div>
    </nav>

    <section class="services">
        <h2>Login</h2>
        <p>Welcome back to AutoEngineer.</p>
        <br>
        <form method="POST" action="{{ url_for('login') }}">
            <input type="email" name="email" placeholder="Email Address" required>
            <br><br>
            <input type="password" name="password" placeholder="Password" required>
            <br><br>
            <button type="submit" class="button">Login</button>
        </form>
    </section>
</body>
</html>
