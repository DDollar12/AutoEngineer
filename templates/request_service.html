<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Service - AutoEngineer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <a class="logo" href="{{ url_for('home') }}">
            <img src="{{ url_for('static', filename='img/autoengineer-logo.svg') }}" alt="AutoEngineer home">
        </a>
        <div>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('customer_dashboard') }}">Dashboard</a>
            <a href="{{ url_for('find_engineers') }}">Find Engineers</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </nav>

    <section class="services">
        <h2>Request a Service</h2>
        <form method="POST" action="{{ url_for('request_service') }}">
        <label for="engineer_id">Choose an engineer</label>
        <select id="engineer_id" name="engineer_id" required>
                <option value="">Select an engineer</option>
                {% for engineer in engineers %}
                    <option value="{{ engineer.id }}">{{ engineer.name }} - {{ engineer.specialization }}</option>
                {% endfor %}
            </select>
            <input type="text" name="service_type" placeholder="Service Type" required>
            <textarea name="problem" placeholder="Describe the problem" rows="5" required></textarea>
            <input type="text" name="location" placeholder="Your location" required>
            <input type="hidden" name="customer_lat" id="customer-latitude">
            <input type="hidden" name="customer_lng" id="customer-longitude">
            <p class="location-note" id="location-note">Allow location access to help your engineer find you faster.</p>
            <button type="submit" class="button">Send Request</button>
        </form>
    </section>
    <script>
        const locationNote = document.getElementById("location-note");
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                document.getElementById("customer-latitude").value = position.coords.latitude;
                document.getElementById("customer-longitude").value = position.coords.longitude;
                locationNote.textContent = "Live pickup point attached to this request.";
                locationNote.classList.add("location-ready");
            }, () => {
                locationNote.textContent = "Location access was skipped. Your written address will still be shared.";
            });
        }
    </script>
</body>
</html>
